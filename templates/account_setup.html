<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup — TT Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">
        <div class="text-center space-y-1">
            <h2 class="text-xl font-bold text-slate-900">Account Setup</h2>
            <p class="text-xs text-slate-500">Enter your details to verify and proceed to checkout</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-xl text-xs">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('account_setup') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="e.g. Titus Kipkorir" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
                <input type="text" name="identifier" required placeholder="0718930255" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Gmail Address</label>
                <input type="email" name="gmail" required placeholder="you@gmail.com" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Strong Password (Min. 8 characters)</label>
                <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-xs shadow-md transition">
                Send Verification Code
            </button>
        </form>
    </div>

</body>
</html>
