<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - TT Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-400">TT Electronics</h1>
            <p class="text-sm text-gray-400 mt-1">Admin Password Recovery</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-indigo-500/10 border border-indigo-500 text-indigo-300 px-4 py-3 rounded-lg text-sm mb-6">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_forgot_password') }}" class="space-y-6">
            {% if step == 'request' %}
                <input type="hidden" name="action" value="request">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Authorized Admin Email</label>
                    <input type="email" name="email" required 
                           class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-white placeholder-gray-500 transition"
                           placeholder="Enter your admin gmail">
                </div>
                <button type="submit" 
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/25 transition duration-200">
                    Send Verification Code
                </button>
            {% else %}
                <input type="hidden" name="action" value="verify">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">6-Digit OTP Code</label>
                    <input type="text" name="otp" required maxlength="6"
                           class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-white placeholder-gray-500 transition tracking-widest text-center text-lg"
                           placeholder="123456">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">New Admin Password</label>
                    <input type="password" name="new_password" required minlength="6"
                           class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-white placeholder-gray-500 transition"
                           placeholder="Minimum 6 characters">
                </div>
                <button type="submit" 
                        class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg shadow-lg hover:shadow-emerald-500/25 transition duration-200">
                    Reset Password
                </button>
            {% endif %}
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('admin_login') }}" class="text-sm text-gray-400 hover:text-indigo-400 transition">
                &larr; Back to Admin Login
            </a>
        </div>
    </div>
</body>
</html>
