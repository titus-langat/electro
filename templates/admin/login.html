<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — TT ELECTRICAL AND ELECTRONICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen px-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-gauge-high text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Admin Portal</h1>
            <p class="text-xs text-slate-400 mt-1">TT Electronics & Electricals — Bomet CBD</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs px-4 py-3 rounded-xl flex items-center space-x-2">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                  <span>{{ msg }}</span>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Admin Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="w-full bg-slate-900 text-slate-100 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-6 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Secure Login</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="{{ url_for('index') }}" class="text-xs text-slate-400 hover:text-indigo-400 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Return to Shop Front
            </a>
        </div>
    </div>
</body>
</html>
