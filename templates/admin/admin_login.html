<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ BUSINESS.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h4>🔐 Admin Portal</h4>
            <p class="text-muted small">{{ BUSINESS.name }}</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-warning py-2 small" role="alert">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">Admin Password</label>
                <input type="password" class="form-control" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100">Log In</button>
        </form>

        <div class="mt-3 text-center">
            <a href="{{ url_for('admin_forgot_password') }}" class="text-decoration-none small text-primary">Forgot Password? (OTP Recovery)</a>
        </div>
        
        <div class="mt-2 text-center">
            <a href="{{ url_for('index') }}" class="text-decoration-none small text-muted">&larr; Back to Storefront</a>
        </div>
    </div>

</body>
</html>
