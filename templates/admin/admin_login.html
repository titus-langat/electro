<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - {{ BUSINESS.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-400">TT Electronics</h1>
            <p class="text-sm text-gray-400 mt-1">Admin Portal Access</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-500/10 border border-red-500 text-red-400 px-4 py-3 rounded-lg text-sm mb-6">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Admin Password</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-white placeholder-gray-500 transition"
                       placeholder="Enter admin password">
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/25 transition duration-200">
                Log In
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('index') }}" class="text-sm text-gray-400 hover:text-indigo-400 transition">
                &larr; Back to Storefront
            </a>
        </div>
    </div>
</body>
</html>
