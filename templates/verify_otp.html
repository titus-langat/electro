<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | TT Electronics & Electronics</title>
    <style>
        body {
            background-color: #f4efdc;
            background-image: linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, 0.03) 25%, rgba(0, 0, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.03) 75%, rgba(0, 0, 0, 0.03) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, 0.03) 25%, rgba(0, 0, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.03) 75%, rgba(0, 0, 0, 0.03) 76%, transparent 77%, transparent);
            background-size: 30px 30px;
            font-family: 'Courier New', Courier, monospace;
            color: #2c2c2c;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            max-width: 440px;
            width: 100%;
            background: #fffdf9;
            padding: 40px;
            border: 2px solid #b5a98d;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align: center; border-bottom: 2px dashed #b5a98d; padding-bottom: 15px; margin-bottom: 25px;">
            <h2 style="font-size: 18px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 5px 0;">Security Verification</h2>
            <p style="font-size: 12px; color: #666; margin: 0;">Code sent to: <strong>{{ gmail }}</strong></p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: #fcf8e3; border: 1px solid #faebcc; padding: 10px; margin-bottom: 15px; font-size: 12px; color: #8a6d3b;">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label style="display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px;">Enter 6-Digit OTP Code</label>
                <input type="text" name="otp" required placeholder="------" maxlength="6" autofocus
                       style="width: 100%; padding: 12px; background: #f4efdc; border: 1px solid #b5a98d; font-family: 'Courier New', Courier, monospace; font-size: 18px; text-align: center; letter-spacing: 4px; outline: none; box-sizing: border-box;">
            </div>
            <div>
                <button type="submit" style="width: 100%; background: #1a1a1a; color: #fffdf9; border: none; padding: 14px; font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;">
                    Verify & Proceed &rarr;
                </button>
            </div>
        </form>
    </div>
</body>
</html>
